<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Time coupon · Time for UBI</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/app.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="coupon-page">
<div class="stripe"></div>
<div class="topbar">
  <a href="/" class="back" id="backLink" aria-label="Back to my wallet"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <a href="/"><img src="/static/flag.png" alt="Time for UBI"></a>
  <span class="page-title">Time coupon</span>
</div>
<main>
  <div class="ticket">
    <div class="stripe"></div>
    <div class="ticket-body">
      <div class="ticket-kicker">Time coupon</div>
      <div class="amount num" id="amount">…</div>
      <p class="ticket-from" id="from"></p>
      <div id="qr" hidden><img class="qr" id="qrImg" alt="QR code of this coupon"><div class="link" id="link"></div></div>
      <p class="status msg" id="status"></p>
      <button class="btn" id="redeemBtn" hidden>Receive it into my Vault</button>
      <a class="btn" id="tgBtn" hidden>Open in Telegram to receive it</a>
      <p class="hint" id="help"></p>
    </div>
  </div>
  <footer>
    <nav class="sites" aria-label="Time for UBI websites">
      <a href="https://ubi.education" data-ext>The book</a>
      <a href="https://ubi.vision" data-ext>The spec</a>
      <a href="https://ubi.world" data-ext>The ledger</a>
    </nav>
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const ID = "__COUPON_ID__";
const pad = n => String(n).padStart(2, '0');
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseUTC(s){ const m = /^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(s || ''); return m ? Date.UTC(+m[1], m[2]-1, +m[3], +m[4], +m[5]) : null; }
function sayWhen(s){
  const t = parseUTC(s); if (t === null) return s || '';
  const d = new Date(t), now = new Date();
  if (t === Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1)) return 'midnight UTC tonight';
  const year = d.getUTCFullYear() === now.getUTCFullYear() ? '' : ` ${d.getUTCFullYear()}`;
  return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}${year}, ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())} UTC`;
}
async function api(path, body){
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)} : {});
  return r.json();
}
function setFrom(handle){ $('from').textContent = ''; $('from').append('from '); const s = document.createElement('span'); s.className = 'mono'; s.textContent = handle || ''; $('from').append(s); }

async function load(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData) { tg.ready(); await api('/auth/webapp', {initData: tg.initData}); }
  const r = await api('/api/coupon/' + ID);
  if (!r.ok) { $('amount').textContent = '—'; $('status').textContent = 'There is no coupon at this address.'; $('help').innerHTML = '<a href="/">Go to your wallet</a>'; return; }
  const c = r.coupon;
  $('amount').textContent = c.amount_text;
  setFrom(c.issuer_handle);
  $('tgBtn').href = c.link;
  if (c.status === 'issued') {
    $('qr').hidden = false; $('qrImg').src = '/api/coupon/' + ID + '/qr.png'; $('link').textContent = c.link;
    $('status').innerHTML = 'Can be opened until <strong>' + sayWhen(c.expires_at) + '</strong>.';
    if (c.is_mine) { $('help').textContent = 'This is your coupon. Show the code or send the link; the first person to open it receives the time.'; }
    else if (r.logged_in) { $('redeemBtn').hidden = false; $('help').textContent = 'The time goes into your Time Vault.'; }
    else { $('tgBtn').hidden = false; $('help').textContent = 'No handle yet? Telegram opens the bot and it makes one for you.'; }
  } else if (c.status === 'redeemed') {
    $('status').textContent = 'Already opened by ' + (c.redeemer_handle || 'someone') + '.';
    $('help').textContent = 'A coupon can be received once.';
  } else {
    $('status').textContent = 'This coupon ran out of time on ' + sayWhen(c.expires_at) + '.';
    $('help').textContent = 'What it held went to the Universal Circles.';
  }
}
$('redeemBtn').addEventListener('click', async () => {
  $('redeemBtn').disabled = true;
  const r = await api('/api/redeem', {code: ID});
  if (r.ok) {
    $('status').className = 'status msg ok'; $('status').textContent = `You received ${r.amount_text} from ${r.from}. Your Vault now holds ${r.vault_text}.`;
    $('redeemBtn').hidden = true; $('qr').hidden = true; $('help').innerHTML = '<a href="/">Back to your wallet</a>';
  } else {
    $('status').className = 'status msg err';
    $('status').textContent = ({
      own_coupon: 'This is your own coupon. Time you give cannot come back to you.',
      redeemed: 'Someone already opened this coupon.',
      expired: 'This coupon ran out of time. What it held went to the Universal Circles.',
      locked: 'This coupon was made for a different handle.'
    })[r.error] || 'The coupon could not be received. Please try again.';
    $('redeemBtn').disabled = false;
  }
});
$('backLink').addEventListener('click', e => {
  try { if (document.referrer && new URL(document.referrer).origin === location.origin && history.length > 1) { e.preventDefault(); history.back(); } } catch (_) {}
});
{ const tg = window.Telegram && window.Telegram.WebApp; if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(() => { location.href = '/'; }); } }
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-ext]'); if (!a) return;
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.openLink) { e.preventDefault(); tg.openLink(a.href); }
});
load();
</script>
</body>
</html>
